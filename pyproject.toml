[project]
name = "fineprint"
version = "0.1.0"
description = "Plain-language legal document assistant: explains, compares and answers questions about legal documents, grounded in quotes verified against the source."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.9,<3",
    "fastapi>=0.115",
    "starlette>=1.6",
    "uvicorn>=0.30",
    "pypdf[crypto]>=6",
    "defusedxml>=0.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-defusedxml",
    "httpx2",  # the HTTP client Starlette's TestClient expects
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fineprint"]
branch = true

[tool.coverage.report]
fail_under = 98
show_missing = true

[tool.mypy]
files = ["fineprint", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "PLW1514"]
# PLW1514 (open() without encoding=) is a preview rule; Windows defaults to cp1252.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
# pytest asserts are how tests work; fixed fake keys in tests are not secrets.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
line-ending = "lf"
