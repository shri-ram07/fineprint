[project]
name = "fineprint"
version = "0.1.0"
description = "Plain-language legal document assistant: explains, compares and answers questions about legal documents, grounded in quotes verified against the source."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8,<2",
    "fastapi>=0.115",
    "starlette>=1.6",
    "uvicorn>=0.30",
    "pypdf[crypto]>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PLW1514"]
# PLW1514 (open() without encoding=) is a preview rule; Windows defaults to cp1252.
preview = true
explicit-preview-rules = true

[tool.ruff.format]
line-ending = "lf"
