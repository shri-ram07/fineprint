name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so newly published vulnerabilities in the locked dependencies are caught even
  # when nothing is pushed (the repo keeps a single branch, so no update bots open branches).
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Tests with a coverage floor
        run: uv run --with coverage==7.* coverage run -m pytest -q && uv run --with coverage==7.* coverage report
      - name: Frontend helper tests
        run: node --test "tests/js/*.test.mjs"
      - name: Audit runtime dependencies for known vulnerabilities
        run: |
          uv export --no-dev --no-emit-project --format requirements-txt -o requirements.txt
          uvx pip-audit==2.10.1 --requirement requirements.txt --require-hashes --disable-pip
